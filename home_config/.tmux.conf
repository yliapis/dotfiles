# Set default terminal type for better compatibility
set -g default-terminal "xterm-256color"

# Enable mouse support for scrolling and pane resizing
set -g mouse on

# Increase history limit for better scrollback
set -g history-limit 10000

# Status bar styling
set -g status-bg colour234
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 5

# Clean, readable status bar with essential info
set -g status-left "#[bg=colour234,fg=cyan] #S #[bg=colour234,fg=white]"
set -g status-right "#[bg=colour234,fg=white]#[bg=white,fg=black] %H:%M #[bg=white,fg=red]#[bg=red,fg=white] #(whoami)@#H"

# Window list formatting
setw -g window-status-format " #[fg=white]#I:#W "
setw -g window-status-current-format " #[bg=blue,fg=white]#I:#W "

# Active pane border styling for visibility
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=cyan"

# Vim-style pane navigation
setw -g mode-keys vi
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# Split panes easily
bind | split-window -h
bind - split-window -v

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Better pane separation
set -g pane-border-lines heavy
